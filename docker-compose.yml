name: black-amber-coffee

services:
  postgres:
    build:
      context: ./Database
      dockerfile: Dockerfile
    container_name: postgres
    restart: unless-stopped
    env_file:
      - path: ./Database/.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-black_amber_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - black_amber_postgres_data:/var/lib/postgresql/data
    networks:
      - black-amber-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-black_amber_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - black-amber-network

  backend:
    build:
      context: ./Backend
      dockerfile: dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      PUBLIC_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-black_amber_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-black_amber_db}
      DB_SSL: "false"
      AUTO_SEED: "true"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"
      JWT_SECRET: ${JWT_SECRET:-black_amber_dev_jwt_secret_min_16_chars}
      JWT_SECRET_REFRESH: ${JWT_SECRET_REFRESH:-black_amber_dev_refresh_secret_min_16_chars}
      JWT_EXPIRATION: "15m"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - black-amber-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3001/v1/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  funcionario-adm:
    image: black-amber-coffee-frontend:dev
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: funcionario-adm
    restart: unless-stopped
    working_dir: /app/app/admin
    command: ["/app/node_modules/.bin/vite", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:3001/v1/api
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - black-amber-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  cliente:
    image: black-amber-coffee-frontend:dev
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: cliente
    restart: unless-stopped
    working_dir: /app/app/client
    command: ["/app/node_modules/.bin/vite", "--host", "0.0.0.0", "--port", "5174"]
    environment:
      VITE_API_BASE_URL: http://localhost:3001/v1/api
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - black-amber-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5174/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  black_amber_postgres_data:
    name: black-amber-postgres-data

networks:
  black-amber-network:
    driver: bridge
    name: black-amber-network
