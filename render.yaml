databases:
  - name: black-amber-db
    databaseName: black_amber
    user: black_amber_user
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: black-amber-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm run start
    healthCheckPath: /v1/api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: black-amber-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_SECRET_REFRESH
        generateValue: true
      - key: JWT_EXPIRATION
        value: "15m"
      - key: CORS_ORIGIN
        value: https://black-amber-admin.onrender.com,https://black-amber-client.onrender.com
      - key: BUCKET_NAME
        value: imagens
      - key: BUCKET_ACCESS_KEY
        sync: false
      - key: BUCKET_SECRET_KEY
        sync: false
      - key: BUCKET_URL
        sync: false
      - key: BUCKET_PUBLIC_URL
        sync: false
      - key: BUCKET_REGION
        value: us-east-1
      - key: RESEND_API_KEY
        sync: false
      - key: SYSTEM_MAIL_ADDR
        value: onboarding@resend.dev

  - type: web
    name: black-amber-admin
    runtime: static
    rootDir: Frontend
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build:admin
    staticPublishPath: app/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://black-amber-api.onrender.com/v1/api

  - type: web
    name: black-amber-client
    runtime: static
    rootDir: Frontend
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build:client
    staticPublishPath: app/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://black-amber-api.onrender.com/v1/api
