databases:
  - name: black-amber-db
    databaseName: black_amber
    user: black_amber_user
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: black-amber-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start
    healthCheckPath: /v1/api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: black-amber-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "true"
      - key: AUTO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: black-amber-admin
    runtime: static
    rootDir: Frontend
    buildCommand: npm install --no-audit --no-fund && npm run build:admin
    staticPublishPath: app/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  - type: web
    name: black-amber-client
    runtime: static
    rootDir: Frontend
    buildCommand: npm install --no-audit --no-fund && npm run build:client
    staticPublishPath: app/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
